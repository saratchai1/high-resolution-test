name: Recover 2025-09 super-resolution group

on:
  push:
    branches:
      - feature/13-stc-monthly-superres-v1
    paths:
      - '.github/workflows/recover-2025-09.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: 13-stc-recover-2025-09
  cancel-in-progress: true

env:
  BASE_RUN_ID: '33617378334'

jobs:
  recover:
    name: build 2025-09 +3mo recovery
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/13-stc-monthly-superres-v1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile scripts/superres/common.py scripts/superres/build_month.py scripts/superres/build_month_v2.py

      - name: Recover 2025-09 through 2025-11
        env:
          PYTHONUNBUFFERED: '1'
        run: >-
          python scripts/superres/build_month_v2.py
          --config config/superres/13-stc.yml
          --start 2025-09
          --months 3

      - name: Upload recovered group
        uses: actions/upload-artifact@v4
        with:
          name: superres-2025-09
          path: outputs/superres/13-stc/
          if-no-files-found: error
          retention-days: 30
          compression-level: 1

  publish:
    name: reuse artifacts + assemble 36 months
    needs: recover
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/13-stc-monthly-superres-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install publish dependencies
        run: pip install 'Pillow>=10,<12' 'PyYAML>=6,<7' 'shapely>=2,<3'

      - name: Wait for the other 11 base artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request

          run_id = os.environ['BASE_RUN_ID']
          repo = os.environ['GH_REPOSITORY']
          token = os.environ['GH_TOKEN']
          expected = {
              'superres-2023-09', 'superres-2023-12',
              'superres-2024-03', 'superres-2024-06', 'superres-2024-09', 'superres-2024-12',
              'superres-2025-03', 'superres-2025-06',
              'superres-2025-12', 'superres-2026-03', 'superres-2026-06',
          }
          url = f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100'
          run_url = f'https://api.github.com/repos/{repo}/actions/runs/{run_id}'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def get_json(target):
              req = urllib.request.Request(target, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          for attempt in range(60):
              data = get_json(url)
              names = {a['name'] for a in data.get('artifacts', []) if not a.get('expired')}
              missing = sorted(expected - names)
              if not missing:
                  print('All 11 base artifacts are ready.')
                  break
              run = get_json(run_url)
              print(f'Base artifacts ready={len(expected)-len(missing)}/11; missing={missing}; run={run.get("status")}/{run.get("conclusion")}')
              if run.get('status') == 'completed' and missing:
                  raise SystemExit(f'Base run completed before required artifacts existed: {missing}')
              time.sleep(15)
          else:
              raise SystemExit('Timed out waiting for base artifacts')
          PY

      - name: Download 11 reusable groups from base run
        uses: actions/download-artifact@v4
        with:
          pattern: superres-*
          path: _artifacts
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.BASE_RUN_ID }}

      - name: Download recovered 2025-09 group
        uses: actions/download-artifact@v4
        with:
          name: superres-2025-09
          path: _artifacts
          merge-multiple: true

      - name: Assemble web dataset
        run: >-
          python scripts/superres/assemble_dataset.py
          --artifact-root _artifacts
          --config config/superres/13-stc.yml

      - name: Validate complete 36-month dataset
        run: python scripts/superres/validate_dataset.py

      - name: Commit lightweight 36-month web dataset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/public/data/superres25 outputs/manifests/13-stc-monthly-summary.json
          if git diff --cached --quiet; then
            echo 'No dataset changes to commit.'
          else
            git commit -m 'data: publish 13-STC 36-month super-resolution dataset [skip ci]'
            git push origin HEAD:feature/13-stc-monthly-superres-v1
          fi

      - name: Upload complete recovery manifest and raster collection
        uses: actions/upload-artifact@v4
        with:
          name: 13-stc-36-month-superres-recovered
          path: |
            _artifacts
            outputs/manifests/13-stc-monthly-summary.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 1
